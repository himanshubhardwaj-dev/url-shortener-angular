<div class="auth-page">

    <header class="auth-header">
        <a routerLink="/" class="brand">
            <span class="brand-mark">↗</span>
            <span>Shortly</span>
        </a>

        <a routerLink="/" class="back-link">
            ← Back to home
        </a>
    </header>


    <main class="auth-content">

        <section class="auth-card">

            <div class="auth-icon">
                +
            </div>

            <span class="auth-label">
                GET STARTED
            </span>

            <h1>
                Create your account.
            </h1>

            <p class="auth-description">
                Start creating short, powerful links and understand
                how your audience interacts with them.
            </p>


            <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

                <div class="name-row">

                    <div class="form-group">
                        <label for="firstName">
                            First name
                        </label>

                        <input id="firstName" type="text" placeholder="John" formControlName="firstName"/>
                    </div>


                    <div class="form-group">
                        <label for="lastName">
                            Last name
                        </label>

                        <input id="lastName" type="text" placeholder="Doe" formControlName="lastName" />
                    </div>

                </div>


                <div class="form-group">
                    <label for="registerEmail">
                        Email
                    </label>

                    <input id="registerEmail" type="email" placeholder="you@example.com" formControlName="email"/>
                </div>


                <div class="form-group">
                    <label for="registerPassword">
                        Password
                    </label>

                    <input id="registerPassword" type="password" placeholder="Create a password" formControlName="password"/>
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input id="confirmPassword" type="password" placeholder="Confirm your password" formControlName="confirmPassword" />
                </div>


                <button type="submit" class="submit-button">
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <p class="switch-auth">
                Already have an account?
                <a routerLink="/login">
                    Sign in
                </a>
            </p>

        </section>

    </main>

</div>
